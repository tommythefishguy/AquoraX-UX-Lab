<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AquoraX Beginner Mode</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="hero">
  <h1>AquoraX Beginner Mode</h1>
  <p>Your calm reef companion.</p>
  <div class="actions">
    <button>AquoraX Cam</button>
    <button>Upload Photo</button>
  </div>
</div>

<section class="card">
  <h2>Coral Tracker</h2>
  <p>Track coral growth visually over time.</p>
  <input type="range" min="0" max="100" value="35">
</section>

<section class="card">
  <h2>Fish Tracker</h2>
  <p>Monitor fish health and feeding.</p>
  <input type="range" min="0" max="100" value="72">
</section>

<section class="card">
  <h2>Ask AquoraX</h2>
  <p>What would you like help with today?</p>
  <div class="chips">
    <span>High Nitrate</span>
    <span>First Coral</span>
    <span>Water Changes</span>
  </div>
</section>

<nav class="bottom-nav">
  <div>Home</div>
  <div>Livestock</div>
  <div>Journey</div>
  <div>Tests</div>
  <div>Settings</div>
</nav>

<script src="js/app.js"></script>
</body>
</html>
