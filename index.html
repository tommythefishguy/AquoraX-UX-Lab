<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AquoraX UX Lab</title>
<style>
body{background:#071018;color:#e8f6ff;font-family:Arial,sans-serif;margin:0;padding:20px;}
.hero{background:rgba(40,90,140,.25);border:1px solid rgba(120,180,255,.2);padding:24px;border-radius:24px;margin-bottom:20px;}
.card{background:rgba(255,255,255,.04);padding:18px;border-radius:18px;margin-bottom:16px;}
button{background:#0f5ea8;color:white;border:none;padding:12px 18px;border-radius:12px;margin-right:8px;}
input[type=range]{width:100%;}
</style>
</head>
<body>
<div class="hero">
<h1>AquoraX Beginner Mode</h1>
<p>Calm reef companion experience.</p>
<button>AquoraX Cam</button>
<button>Upload Photo</button>
</div>

<div class="card">
<h2>Coral Tracker</h2>
<p>Track coral growth and reef health over time.</p>
<label>Growth Progress</label>
<input type="range" min="0" max="100" value="40">
</div>

<div class="card">
<h2>Fish Tracker</h2>
<p>Monitor feeding, health and behaviour.</p>
<label>Health Status</label>
<input type="range" min="0" max="100" value="75">
</div>

<div class="card">
<h2>Ask AquoraX</h2>
<p>What would you like help with today?</p>
<button>High Nitrate</button>
<button>First Coral</button>
<button>Understanding Alkalinity</button>
</div>
</body>
</html>
